<h2 class="mx-3">Available Sessions</h2>
<mat-dialog-content>
<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Start</th>
      <th>Registrations</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for(session of lsService.currentLeagueSessions() | async; track session){
      <tr app-session-dialog-item-component [session]="session"></tr>
    }
  </tbody>
</table>
</mat-dialog-content>
