<mat-card-content>
  <div class="form pe-4">
    <mat-form-field>
      <mat-label>Username:</mat-label>
      <input matInput
             type="text"
             name="username"
             required
             minlength="3"
             maxlength="80"
             [(ngModel)]="Form().username"
             #username="ngModel"
             placeholder="racer">
    </mat-form-field>
    @if (username.errors && username.dirty){
      <mat-error>{{username.errors[0]}}</mat-error>
    }
    <mat-form-field>
      <mat-label>Email address:</mat-label>
      <input matInput
             type="email"
             name="email"
             required
             email="true"
             [(ngModel)]="Form().email"
             #email="ngModel"
             placeholder="racer@m3.example"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>SteamID:</mat-label>
      <input matInput
             type="text"
             required
             name="steamID"
             minlength="17"
             maxlength="17"
             [(ngModel)]="Form().steamId"
             #steamId="ngModel"
             placeholder="717555055"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password:</mat-label>
      <input matInput
             name="password"
             minlength="8"
             required
             [(ngModel)]="Form().password"
             #password="ngModel"
             type="password"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password again:</mat-label>
      <input matInput
             name="passwordAgain"
             minlength="8"
             required
             [(ngModel)]="passwordAgain"
             #passwordCheck="ngModel"
             type="password"/>
    </mat-form-field>
  </div>
</mat-card-content>
<mat-card-actions>
  <button matButton="text"
          [disabled]="username.errors || email.errors || steamId.errors || password.errors || passwordCheck.errors"
          (click)="Submit()">
    <mat-icon fontIcon="done"/>
    Submit
  </button>
</mat-card-actions>
