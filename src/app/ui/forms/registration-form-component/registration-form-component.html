<mat-card-content>
  <div class="form pe-4">
    <mat-form-field>
      <mat-label>Username:</mat-label>
      <input matInput type="text" placeholder="racer">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Email address:</mat-label>
      <input matInput type="text" placeholder="racer@m3.example"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>SteamID:</mat-label>
      <input matInput type="text" placeholder="717555055"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password:</mat-label>
      <input matInput type="password"/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password again:</mat-label>
      <input matInput type="password"/>
    </mat-form-field>
  </div>
</mat-card-content>
<mat-card-actions>
  <button matButton="text">
    <mat-icon fontIcon="done"/>
    Submit
  </button>
</mat-card-actions>
