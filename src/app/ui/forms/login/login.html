<div class="form mx-5">
  <h1>Log in</h1>
  <mat-form-field>
    <mat-label>Username:</mat-label>
    <input matInput
           type="text"
           placeholder="racer"
           [(ngModel)]="loginForm.email"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password:</mat-label>
    <input matInput
           type="password"
           [(ngModel)]="loginForm.password" />
  </mat-form-field>
  <button matButton="filled"
          (click)="UpdateLogin()"
          [showProgress]="loginProgress()">
    Submit
    <mat-progress-spinner mode="indeterminate"
                          diameter="20"
                          tabindex=""
                          progressIndicator />
  </button>
</div>
