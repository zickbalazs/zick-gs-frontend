<mat-card class="p-3">
  <app-league-item-title-component [title]="league().name"
                                   [from]="league().start"
                                   [to]="league().end" />
  <app-league-item-body-component [league]="league()" />
  @if(leagueHasSessions(league())) {
    <mat-card-actions>
      <button matButton="text" (click)="ViewSessions()">View Sessions</button>
    </mat-card-actions>
  }
  @else{
    <p>This league doesn't have active sessions yet, check back later!</p>
  }
</mat-card>
